name: Python Application CI Pipeline

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "helm_charts/**"
      
  workflow_dispatch:

permissions:
  contents: write   # Necessary for the GitOps bot to commit and push to your repo

jobs:
  build-and-ship:
    runs-on: ubuntu-latest
    steps:
      # 1. Fetch the Python app code from this repo
      - name: Checkout Application Code
        uses: actions/checkout@v4

      # 2. Production Security Scan
      - name: Run Trivy FS Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          exit-code: '1' # Fails the build immediately if security bugs are found
          severity: 'CRITICAL,HIGH'

      # 3. Authenticate with AWS using Repository Secrets
      - name: Configure AWS Credentials (Static Keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2 # Match your Sydney infrastructure region

      # 4. Log in to your manual AWS ECR registry
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 5. Build, tag, and push the Python image
      - name: Build and Push Image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: my-end-to-end/images # Ensure this matches your manually created ECR Repo Name
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          echo "+++++++++++++++++++++++++++++++++++++++++++++++++"
          echo "Printing duild images"
          docker image ls
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
